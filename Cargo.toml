[workspace]
members = [
    "co-circom/circom-mpc-compiler",
    "co-circom/circom-mpc-vm",
    "co-circom/co-circom-types",
    "co-circom/co-circom",
    "co-circom/co-groth16",
    "co-circom/co-plonk",
    "co-noir/co-acvm",
    "co-noir/co-brillig",
    "co-noir/co-builder",
    "co-noir/ultrahonk",
    "co-noir/co-ultrahonk",
    "co-noir/co-noir",
    "co-noir/co-noir-types",
    "co-noir/noir-types",
    "co-noir/co-noir-common",
    "mpc-core",
    "mpc-net",
    "tests",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"
authors = ["TACEO GmbH <hello@taceo.io>"]
homepage = "https://www.taceo.io"
repository = "https://github.com/TaceoLabs/co-snarks"
license = "MIT OR Apache-2.0"
publish = false
readme = "./README.md"

[workspace.dependencies]
acir = { version = "1.0.0-beta.22", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-beta.22", package = "acir" }
acvm = { version = "1.0.0-beta.22", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-beta.22", package = "acvm" }
brillig = { version = "1.0.0-beta.22", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-beta.22", package = "brillig" }
noirc-abi = { version = "1.0.0-beta.22", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-beta.22", package = "noirc_abi" }
noirc-artifacts = { version = "1.0.0-beta.22", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-beta.22", package = "noirc_artifacts" }

# Noir v1.0.0-beta.22 depends on arkworks 0.6, so the whole workspace moves to 0.6
# to keep field-element types unified across acir and mpc-core.
ark-bls12-377 = "0.6"
ark-bls12-381 = "0.6"
ark-bn254 = "0.6"
# parallel/asm were ALREADY active via feature unification from other deps
# (verified with cargo tree 2026-07-24); declared explicitly here so they
# survive dependency changes rather than riding on an accident.
ark-ec = { version = "0.6", default-features = false, features = ["std", "parallel"] }
ark-groth16 = { version = "0.6" }
ark-ff = { version = "0.6", features = ["parallel"] }
ark-grumpkin = "0.6"
ark-poly = { version = "0.6", features = ["parallel"] }
ark-relations = "0.6"
ark-serialize = { version = "0.6", features = ["derive", "std"] }
ark-std = { version = "0.6", features = ["std"] }
bincode = "1.3"
blake2 = "0.10"
blake3 = "1.6"
bytemuck = { version = "1.25", features = ["derive"] }
byteorder = "1.5"
bytes = "1.11"
circom-types = { package = "taceo-circom-types", version = "0.2" }
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
criterion = { version = "0.5", features = ["async_tokio"] }
eyre = "0.6"
figment = { version = "0.10", features = ["toml", "env"] }
hex-literal = "0.4"
intmap = "3.1"
itertools = "0.14"
num-bigint = { version = "0.4" }
num-traits = { version = "0.2", default-features = false }
paste = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.8"
rcgen = "0.13"
rustls = "0.23"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
libaes = "0.7"
sha2 = { version = "0.10", features = ["compress"] }
sha3 = "0.10"
nom = "7"
ruint = "1.17"
subtle = "2.6"
thiserror = "2"
toml = "0.8"
tracing = { version = "0.1" }
tracing-subscriber = "0.3"

# Vendored copies of the taceo circom helper crates with their arkworks deps
# bumped from 0.5 to 0.6 (required to unify field types with Noir v1.0.0-beta.22,
# which depends on arkworks 0.6). Drop these patches once upstream releases
# versions built against arkworks 0.6.
[patch.crates-io]
taceo-circom-types = { path = "vendor/taceo-circom-types" }
taceo-ark-serde-compat = { path = "vendor/taceo-ark-serde-compat" }

# This profile can be used for CI in pull requests.
# Debug symbols in release: costs binary size only (no codegen change), and
# makes release binaries profileable (samply/perf symbolication).
# NOTE (measured 2026-07-24): lto fat/thin and codegen-units=1 were tried and
# DROPPED — prove-time delta was inside the +/-2-3% host-noise floor on a
# 3-way interleaved A/B (sha256 witness-fed plaindriver, 6-8 pairs), while
# fat LTO cost a ~4.5 min link per rebuild (vs ~40 s). Revisit only if
# profiling ever shows cross-crate call overhead on the hot path.
[profile.release]
debug = true

[profile.ci-dev]
opt-level = 1
inherits = "dev"
incremental = false
debug = true
overflow-checks = false
# [profile.ci-dev.build-override]
# opt-level = 3
